<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enter Student Marks · Student Web Portal</title><link rel="stylesheet" href="../css/style.css"></head><body onload="guard('faculty')"><div class="app"><aside class="sidebar"><div class="brand">KLU · Faculty</div><nav class="nav"><a class="" href="dashboard.html">Dashboard</a><a class="" href="students.html">My Students</a><a class="" href="attendance.html">Attendance</a><a class="active" href="marks.html">Enter Marks</a><a class="" href="assignments.html">Assignments</a><a class="" href="performance.html">Performance</a><a class="" href="announcements.html">Announcements</a><a class="" href="profile.html">Profile</a><a href="#" onclick="logout()">Logout</a></nav></aside><main class="main"><div class="topbar"><h1>Enter Student Marks</h1><span class="badge">Faculty Module</span></div><div class="card"><form onsubmit="addMark(event)"><div class="form-grid"><div class="field"><label>Student</label><select id="markStudent" class="student-select" required></select></div><div class="field"><label>Subject</label><input id="subject" required></div><div class="field"><label>Exam</label><select id="exam"><option>Assignment</option><option>Internal 1</option><option>Internal 2</option><option>Semester</option></select></div><div class="field"><label>Marks</label><input id="marks" type="number" required></div><div class="field"><label>Maximum Marks</label><input id="max" type="number" value="100" required></div></div><button class="btn">Save Marks</button></form></div></main></div><script src="../js/app.js"></script></body></html>
