<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Student Allocation · Student Web Portal</title><link rel="stylesheet" href="../css/style.css"></head><body onload="guard('admin')"><div class="app"><aside class="sidebar"><div class="brand">KLU · Admin</div><nav class="nav"><a class="" href="dashboard.html">Dashboard</a><a class="active" href="new-student.html">New Student Allocation</a><a class="" href="students.html">Students</a><a class="" href="faculty.html">Faculty</a><a class="" href="marks.html">Marks Overview</a><a class="" href="attendance.html">Attendance</a><a class="" href="fees.html">Fees</a><a class="" href="announcements.html">Announcements</a><a class="" href="reports.html">Reports</a><a class="" href="settings.html">Settings</a><a href="#" onclick="logout()">Logout</a></nav></aside><main class="main"><div class="topbar"><h1>New Student Allocation</h1><span class="badge">Admin Module</span></div><div class="card"><h3>Personal & Academic Details</h3><form onsubmit="addStudent(event)"><div class="form-grid"><div class="field"><label>Student Name</label><input id="name" required></div><div class="field"><label>Student ID / Roll No.</label><input id="sid" required></div><div class="field"><label>Date of Birth</label><input id="dob" type="date"></div><div class="field"><label>Gender</label><select id="gender"><option>Female</option><option>Male</option><option>Other</option></select></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Mobile</label><input id="phone"></div><div class="field span-2"><label>Address</label><textarea id="address"></textarea></div><div class="field"><label>Course</label><select id="course"><option>B.Tech</option><option>M.Tech</option><option>BBA</option><option>MBA</option></select></div><div class="field"><label>Department</label><select id="dept"><option>CSE</option><option>ECE</option><option>EEE</option><option>Mechanical</option><option>Civil</option></select></div><div class="field"><label>Year</label><select id="year"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class="field"><label>Semester</label><select id="semester"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div><div class="field"><label>Section</label><select id="section"><option>A</option><option>B</option><option>C</option></select></div><div class="field"><label>Admission Date</label><input id="admission" type="date"></div><div class="field span-2"><label>Temporary Password (optional)</label><input id="password" placeholder="Leave blank to auto-generate"></div></div><button class="btn success">Allocate Student & Create Login</button></form><div id="success" class="success-box"></div></div></main></div><script src="../js/app.js"></script></body></html>
